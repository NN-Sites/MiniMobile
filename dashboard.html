<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MiniMobile</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Rubik',sans-serif;margin:0;padding:0;background:#f0f4ff;color:#0040ff;}
    header{background:#0040ff;color:#fff;padding:20px;text-align:center;}
    h1{margin:0;}
    .stats{display:flex;justify-content:space-around;flex-wrap:wrap;padding:20px;}
    .card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 10px 25px rgba(0,64,255,0.1);margin:10px; flex:1 1 200px; text-align:center;}
    table{width:100%;border-collapse:collapse;margin:20px 0;}
    th, td{padding:12px;border-bottom:1px solid #ccc;text-align:right;}
  </style>
</head>
<body>
  <header>
    <h1>MiniMobile Dashboard</h1>
  </header>

  <div class="stats">
    <div class="card"><h3>סה"כ הזמנות</h3><p id="totalOrders">0</p></div>
    <div class="card"><h3>סה"כ לקוחות</h3><p id="totalCustomers">0</p></div>
  </div>

  <h2 style="text-align:center;">כל ההזמנות</h2>
  <table>
    <thead>
      <tr><th>מוצר</th><th>שם</th><th>מייל</th><th>טלפון</th><th>כתובת</th><th>תאריך</th></tr>
    </thead>
    <tbody id="ordersTable"></tbody>
  </table>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyARjSkgcKQwyykrMO1y9WRVU151EJmr9AM",
      authDomain: "minimobiledashboard.firebaseapp.com",
      projectId: "minimobiledashboard",
      storageBucket: "minimobiledashboard.appspot.com",
      messagingSenderId: "949751968495",
      appId: "1:949751968495:web:e2a060d1b7787d3e7ae11a",
      measurementId: "G-773JZCLCFP"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ordersTable = document.getElementById('ordersTable');
    const totalOrdersEl = document.getElementById('totalOrders');
    const totalCustomersEl = document.getElementById('totalCustomers');

    db.ref('orders').on('value', snapshot => {
      const orders = snapshot.val() || {};
      ordersTable.innerHTML = '';
      const customersSet = new Set();
      Object.values(orders).forEach(order => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${order.product}</td><td>${order.name}</td><td>${order.email}</td><td>${order.phone}</td><td>${order.address}</td><td>${new Date(order.timestamp).toLocaleString()}</td>`;
        ordersTable.appendChild(row);
        customersSet.add(order.email);
      });
      totalOrdersEl.innerText = Object.keys(orders).length;
      totalCustomersEl.innerText = customersSet.size;
    });
  </script>
</body>
</html>
