<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMobile Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Rubik',sans-serif; background:#f0f4ff; margin:0; padding:0; color:#0040ff; }
    h1,h2 { text-align:center; }
    .container { max-width:1200px; margin:50px auto; padding:20px; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th,td { border:1px solid #cce0ff; padding:10px; text-align:right; }
    th { background:#0040ff; color:white; }
    .stats { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin-top:30px; }
    .stat-card { background:white; padding:20px; border-radius:12px; box-shadow:0 10px 20px rgba(0,64,255,0.1); flex:1 1 200px; text-align:center; }
    .stat-card h3 { margin:0; font-size:1.5em; color:#0040ff; }
    .stat-card p { margin:10px 0 0; font-size:1.2em; font-weight:bold; }
  </style>
</head>
<body>
  <h1>MiniMobile Dashboard</h1>
  <div class="container">
    <div class="stats">
      <div class="stat-card"><h3>סה"כ הזמנות</h3><p id="totalOrders">0</p></div>
      <div class="stat-card"><h3>סה"כ לקוחות</h3><p id="totalCustomers">0</p></div>
      <div class="stat-card"><h3>סה"כ הכנסות</h3><p id="totalRevenue">₪0</p></div>
    </div>

    <h2>כל ההזמנות</h2>
    <table id="ordersTable">
      <thead>
        <tr>
          <th>תאריך</th>
          <th>שם</th>
          <th>מייל</th>
          <th>טלפון</th>
          <th>כתובת</th>
          <th>מוצר</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyARjSkgcKQwyykrMO1y9WRVU151EJmr9AM",
      authDomain: "minimobiledashboard.firebaseapp.com",
      projectId: "minimobiledashboard",
      storageBucket: "minimobiledashboard.appspot.com",
      messagingSenderId: "949751968495",
      appId: "1:949751968495:web:e2a060d1b7787d3e7ae11a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const ordersTable = document.getElementById('ordersTable').querySelector('tbody');
    const totalOrdersEl = document.getElementById('totalOrders');
    const totalCustomersEl = document.getElementById('totalCustomers');
    const totalRevenueEl = document.getElementById('totalRevenue');

    db.collection('orders').orderBy('timestamp','desc').onSnapshot(snapshot => {
      ordersTable.innerHTML = '';
      let totalOrders = 0;
      let totalRevenue = 0;
      const customersSet = new Set();

      snapshot.forEach(doc => {
        const order = doc.data();
        totalOrders++;
        totalRevenue += parseFloat(order.product.split('₪')[1]) || 0;
        customersSet.add(order.email);

        const row = document.createElement('tr');
        const date = order.timestamp ? order.timestamp.toDate().toLocaleString('he-IL') : '';
        row.innerHTML = `<td>${date}</td><td>${order.name}</td><td>${order.email}</td><td>${order.phone}</td><td>${order.address}</td><td>${order.product}</td>`;
        ordersTable.appendChild(row);
      });

      totalOrdersEl.innerText = totalOrders;
      totalCustomersEl.innerText = customersSet.size;
      totalRevenueEl.innerText = '₪'+totalRevenue.toFixed(2);
    });
  </script>
</body>
</html>
